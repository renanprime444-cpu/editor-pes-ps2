name: Compilar ELF do PS2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Instalar git
        run: apk add --no-cache git make
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - name: Guardar o .elf
        uses: actions/upload-artifact@v4
        with:
          name: we_editor_elf
          path: we_editor.elf
